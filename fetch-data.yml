name: Update market data

on:
  schedule:
    # Runs at 18:00 IST (12:30 UTC) every weekday, after markets close.
    # Cron is UTC — adjust the hour here if you want a different time.
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write # needed so the workflow can commit the updated JSON back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch AMFI mutual fund NAVs
        run: node scripts/fetch-amfi.mjs

      - name: Fetch NSE stock quotes + history
        run: node scripts/fetch-nse.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mutual-funds.json data/stocks.json
          git diff --quiet --cached || git commit -m "chore: update market data $(date -u +%Y-%m-%d)"
          git push
